const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),hex=a=>Array.from(a,x=>x.toString(16).padStart(2,"0")).join(""),unhex=h=>new Uint8Array(h.match(/../g).map(x=>parseInt(x,16)));
const msg=t=>document.getElementById("msg").textContent=t;
async function derive(pw){const m=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(P.salt),iterations:P.iter,hash:"SHA-256"},m,{name:"AES-GCM",length:256},true,["decrypt"])}
const imp=h=>crypto.subtle.importKey("raw",unhex(h),{name:"AES-GCM"},true,["decrypt"]);
const dec=async(k,o)=>new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(o.iv)},k,b64(o.ct)));
const api="https://api.github.com/repos/"+P.repo+"/contents/"+P.path;
async function getState(tok){const h={Authorization:"Bearer "+tok,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"};
const r=await fetch(api+"?t="+Date.now(),{headers:h,cache:"no-store"});if(r.status==404)return{sha:null,state:null};if(!r.ok)throw new Error("HTTP "+r.status);
const j=await r.json();let txt;if(j.encoding==="base64"&&j.content)txt=new TextDecoder().decode(b64(j.content.replace(/\s/g,"")));
else{const r2=await fetch(api+"?t="+Date.now(),{headers:{...h,Accept:"application/vnd.github.raw"},cache:"no-store"});if(!r2.ok)throw new Error("HTTP "+r2.status);txt=await r2.text()}
return{sha:j.sha,state:JSON.parse(txt)}}
function apply(st){if(!st||!st.keys||!Object.keys(st.keys).length)return;Object.keys(localStorage).filter(k=>k.startsWith("rk_")).forEach(k=>localStorage.removeItem(k));
Object.entries(st.keys).forEach(([k,v])=>{if(k.startsWith("rk_"))localStorage.setItem(k,typeof v=="string"?v:JSON.stringify(v))})}
async function open(key,remember){let app,tok;try{app=await dec(key,P.app);tok=await dec(key,P.tok)}catch(e){localStorage.removeItem(KK);sessionStorage.removeItem(SK);msg("パスワードが違います");return}
const raw=hex(new Uint8Array(await crypto.subtle.exportKey("raw",key)));sessionStorage.setItem(SK,raw);if(remember)localStorage.setItem(KK,raw);

window.__RKC={token:tok,api:api,sha:sha,loadErr:err,build:P.build};document.open();document.write(app);document.close()}
document.getElementById("f").onsubmit=async e=>{e.preventDefault();msg("確認中…");try{await open(await derive(document.getElementById("pw").value),document.getElementById("rem").checked)}catch(x){msg("エラー: "+x)}};
const saved=sessionStorage.getItem(SK)||localStorage.getItem(KK);if(saved){msg("開いています…");imp(saved).then(k=>open(k,false)).catch(()=>{localStorage.removeItem(KK);sessionStorage.removeItem(SK);msg("")})}
