async function derive(pw){const m=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);

const api="https://api.github.com/repos/"+P.repo+"/contents/"+P.path;
async function getState(tok){const h={Authorization:"Bearer "+tok,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"};
const r=await fetch(api+"?t="+Date.now(),{headers:h,cache:"no-store"});if(r.status==404)return{sha:null,state:null};if(!r.ok)throw new Error("HTTP "+r.status);

return{sha:j.sha,state:JSON.parse(txt)}}
function apply(st){if(!st||!st.keys)return;Object.keys(localStorage).filter(k=>k.startsWith("rk_")).forEach(k=>localStorage.removeItem(k));
Object.entries(st.keys).forEach(([k,v])=>{if(k.startsWith("rk_"))localStorage.setItem(k,typeof v=="string"?v:JSON.stringify(v))})}
async function open(key,remember){let app,tok;try{app=await dec(key,P.app);tok=await dec(key,P.tok)}catch(e){localStorage.removeItem(KK);sessionStorage.removeItem(SK);msg("パスワードが違います");return}
const raw=hex(new Uint8Array(await crypto.subtle.exportKey("raw",key)));sessionStorage.setItem(SK,raw);if(remember)localStorage.setItem(KK,raw);
